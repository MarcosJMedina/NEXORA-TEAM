version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: nexora_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: moodle_nexora
      MYSQL_USER: nexora_user
      MYSQL_PASSWORD: nexora_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: nexora_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: .
    container_name: nexora_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./moodles_pdfs:/app/moodles_pdfs
    env_file:
      - .env
    depends_on:
      - mariadb
      - qdrant

volumes:
  mariadb_data:
  qdrant_data: