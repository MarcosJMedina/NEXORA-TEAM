version: '3.8'

services:
  # TUPPER 1: EL GUARDIA DE TRÁFICO (PROXY)
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    env_file:
      - .env

  # BASE DE DATOS VECTORIAL: QDRANT (MOTOR VECTORIAL OFICIAL)
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: nexora_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # TUPPER 2: TU CÓDIGO DE PYTHON
  bot-moodle:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - .:/app
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "3000", "--reload"]
    depends_on:
      - litellm-proxy
      - qdrant

volumes:
  qdrant_data: